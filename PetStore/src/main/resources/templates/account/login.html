<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  视图名：account/login  路由：GET /account/login、POST /account/login
  产出方：AccountController（loginPage / login）
  契约：项目/docs/接口契约.md §1.5、§2.2、§2.3
  model：error(String,可空) 登录失败提示；username(String,可空) 失败回填；
         captchaQuestion(String,**不可空**) 算术题题干
  session：loginUser(Account) —— GET 时若已登录，Controller 直接 redirect:/catalog，不进本模板
  验证码：契约 §1.5/§2.2/§2.5（T-15 后端已就绪）——题干由 `captchaQuestion` 提供且每次渲染
          重新生成；提交参数 `captcha`（String，后端容错解析，空/非数字一律判错）；
          失败文案固定「验证码错误」；答案为一次性，验完即从 session 移除。
-->
<head th:replace="~{fragments/head :: head('宠物商店 · 登录')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container page">
    <div class="page-head">
        <h1 class="page-title">登录</h1>
        <p class="page-lead">登入你的宠物商店账号。购物车与下单功能尚未实现，登录后仍只可浏览商品。</p>
    </div>

    <section class="auth-card">
        <!-- 注册成功后 Controller 重定向到 /account/login?registered=true（契约 §2.2） -->
        <p class="alert alert--ok" th:if="${param.registered != null}">注册成功，请使用新账号登录。</p>

        <!-- 登录失败提示：model.error（契约 §1.5）。成功路径不渲染本视图 -->
        <p class="alert alert--error" th:if="${error != null}" th:text="${error}">用户名或密码错误</p>

        <form class="auth-form" method="post" th:action="@{/account/login}">
            <div class="field">
                <label class="field-label" for="username">用户名</label>
                <input class="field-input" type="text" id="username" name="username"
                       th:value="${username}"
                       placeholder="请输入用户名" autocomplete="username" required>
            </div>

            <div class="field">
                <label class="field-label" for="password">密码</label>
                <input class="field-input" type="password" id="password" name="password"
                       placeholder="请输入密码" autocomplete="current-password" required>
            </div>

            <!-- ===== 验证码（T-20261113-16 接入；契约 §1.5 / §2.2 / §2.5） =====
                 题干由后端 captchaQuestion 提供；提交参数 name="captcha"（String）。
                 答案为一次性：提交后无论对错即失效，失败回页时会重新生成新题。 -->
            <fieldset class="captcha-field">
                <legend class="field-label">验证码</legend>
                <div class="captcha-row">
                    <span class="captcha-question" th:text="${captchaQuestion}">3 + 5 = ?</span>
                    <input class="field-input captcha-input" type="text" id="captcha" name="captcha"
                           placeholder="请输入计算结果" inputmode="numeric" autocomplete="off"
                           aria-describedby="captcha-hint" required>
                </div>
                <p class="field-hint" id="captcha-hint">请计算左侧算式并填入结果；每题仅能使用一次。</p>
            </fieldset>

            <div class="auth-actions">
                <button class="btn btn--primary" type="submit">登录</button>
                <a class="btn btn--ghost" th:href="@{/account/register}">去注册</a>
            </div>
        </form>

        <p class="auth-meta">演示账号：<code>admin / admin123</code>（教学用明文口令，见契约 §3.1）</p>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/petstore.js}"></script>
</body>
</html>
